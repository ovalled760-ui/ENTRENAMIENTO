<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Saldo</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <div class="container">
        <div class="header-text">
            <p>Buen día</p>
            <h2>Juanita</h2>
            <span class="saldo-label">TOTAL SALDO</span>
            <h1>$ 1.300.000</h1>
        </div>
        <div class="profile">
           
            <a href="reto.html">Salir</a>
        </div>
        <div class="card">
            <h3>Transacciones recientes</h3>
        <div class="transaction">
            <img src="img/betplay.png" alt="Apuesta">
            <span>Apuesta fútbol</span>
            <span class="positivo">+450.000</span>
        </div>
        <div class="transaction">
            <img src="img/falabella.png" alt="Calzado">
            <span>Compra de Calzado</span>
            <span class="negativo">-250.000</span>
        </div>
        <div class="transaction">
            <img src="img/davivienda.png" alt="Consignación">
            <span>Consignación Juan</span>
            <span class="positivo">+370.000</span>
        </div>
    </div>

</body>
</html>
