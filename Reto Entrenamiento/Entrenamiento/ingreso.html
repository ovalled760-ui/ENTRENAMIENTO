<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="UTF-8"/>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pantalla Ingreso -PayCad</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
     <link rel="stylesheet" href="ingreso.css">
</head>
<body>

    <div class="container">
        <img src="img/imagen02.png" class="illustration">
        <h2 id="welcome"> Hola!!!</h2>
        <p>Digite el Codigo de Verficacion</p>

        <div class="codigos-inputs">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
        </div>
        <button onclick="validarCodigo()">Siguiente</button>
        <a href="Code.html">Obtener nuevo Codigo</a>
    </div>
    <script>
        const nombreUsuario =
        localStorage.getItem("nombreUsuario") || "nombreUsuario";
        document.getElementById("welcome").textContent = `Hola ${nombreUsuario}!!!`;
        
         function validarCodigo() {
            const inputs=
            document.querySelectorAll(".codigos-inputs input");

            let codigoIngresado = "";
            inputs.forEach(input=> codigoIngresado +=input.value);

            const codigo =
            localStorage.getItem("codigoValido");

            if(codigoIngresado === codigo){
                alert ("Codigo Correcto");
                window.location.href = "home.html";
            } else {
                alert("Codigo Incorrecto. Intente de Nuevo.");
            }
         }
    </script>
