<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="UTF-8"/>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pantalla Nombre -PayCad</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
     <link rel="stylesheet" href="nombre.css">
</head>
<body>
    <div class="contenedor">
        <img src="img/imagen02.png" class="illustration ">
         <h2>Escribe tu nombre</h2>

        <form id="formNombre">
            <label for="nombreUsuario">Nombre de Usuario</label>
            <input type="text" id="nombreUsuario" placeholder="Juanita Diaz">

            <label for="saldoInicial">Saldo Inicial</label>
            <input type="" id="saldoInicia" placeholder="Saldo Incial">

            <button type="submit" class="btn-siguiente">Siguiente</button>
        </form>
    </div>
    <script>
        document.getElementById("formNombre").addEventListener("submit", function(event) {
    event.preventDefault();

    let nombre = document.getElementById("nombreUsuario").value.trim();

    if (nombre === "") {
        alert("Por favor ingrese su nombre.");
        return;}
    localStorage.setItem("nombreUsuario", nombre);
    window.location.href = "ingreso.html";
});
    </script>
