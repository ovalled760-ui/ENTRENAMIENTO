<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="UTF-8"/>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pantalla Code-PayCad</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
     <link rel="stylesheet" href="code.css">
</head>
<body>
    <div class="contenedor">
        <img src="img/imagen02.png" class="illustration ">
        <h2>Codigo de verificacion</h2>
        <p>Codigo de verificacion para tu cuenta</p>
        <div class="codigo" id="codigo">00000</div>
        <p id="temporizador">El codigo se actualizara en 10s</p>
        <a href="nombre.html" class="btn">Siguiente</a>
    </div>
    <script>
        let tiempo = 10;
        let codigo = ""
        function generarCodigo() {
            codigo = Math.floor(10000 + Math.random()* 90000)
            document.getElementById("codigo").textContent=codigo;
            localStorage.setItem("codigoValido", codigo);}
        function actualizarTemporizador()
        {
            tiempo--;

            document.getElementById("temporizador").textContent= `El código se actualizará en ${tiempo}s`;
            if (tiempo<= 0){
                tiempo=10;
                generarCodigo();}
        }
        function iniciar(){
            generarCodigo();
            setInterval(actualizarTemporizador, 1000)
        }
        iniciar()
    </script>
</body>
</html>
